<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Codex 任务循环</title>
<style>
* { box-sizing: border-box; }
body { width: 1120px; height: 650px; margin: 0; padding: 38px 44px; background: #f8faf9; color: #222c29; font-family: "Microsoft YaHei", sans-serif; }
main { position: relative; height: 574px; }
.node { position: absolute; width: 280px; height: 122px; border: 2px solid; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
b { font-size: 36px; line-height: 1.5; font-weight: 600; }
small { font-size: 25px; line-height: 1.6; }
.context { top: 140px; left: 0; background: #e4f3ea; border-color: #438c64; }
.model { top: 140px; left: 375px; background: #e8effa; border-color: #5c80b1; }
.finish { top: 140px; left: 750px; background: #f0f0f0; border-color: #8a8e8d; }
.result { top: 427px; left: 0; background: #e4f3ea; border-color: #438c64; }
.execute { top: 427px; left: 375px; background: #fcf0dc; border-color: #ae873b; }
.permission { top: 427px; left: 750px; background: #fae9e6; border-color: #b16e63; }
.arrow { position: absolute; background: #57655f; }
.right { height: 2px; width: 83px; }
.right::after { content: ""; position: absolute; right: -1px; top: -6px; border-left: 12px solid #57655f; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
.left { height: 2px; width: 83px; }
.left::after { content: ""; position: absolute; left: -1px; top: -6px; border-right: 12px solid #57655f; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
.up { width: 2px; height: 148px; }
.up::after { content: ""; position: absolute; left: -6px; top: -1px; border-bottom: 12px solid #57655f; border-left: 7px solid transparent; border-right: 7px solid transparent; }
.down { width: 2px; height: 77px; }
.down::after { content: ""; position: absolute; left: -6px; bottom: -1px; border-top: 12px solid #57655f; border-left: 7px solid transparent; border-right: 7px solid transparent; }
.branch { position: absolute; left: 514px; top: 262px; width: 377px; height: 86px; border-left: 2px solid #57655f; border-bottom: 2px solid #57655f; }
.label { position: absolute; background: #f8faf9; font-size: 27px; padding: 4px 10px; }
.task { font-size: 35px; position: absolute; top: 5px; left: 20px; color: #276746; }
</style>
<main aria-label="上下文、模型、工具和结果之间的循环">
  <div class="task">用户提出任务</div><div class="arrow down" style="left:139px;top:59px"></div>
  <div class="node context"><b>准备上下文</b><small>任务、规则、历史</small></div>
  <div class="arrow right" style="left:286px;top:201px"></div>
  <div class="node model"><b>模型判断</b><small>决定下一步</small></div>
  <div class="arrow right" style="left:662px;top:201px"></div>
  <div class="label" style="left:675px;top:95px">收尾</div>
  <div class="node finish"><b>结束本轮</b><small>无需继续工作</small></div>
  <div class="branch"></div><div class="arrow down" style="left:889px;top:348px"></div>
  <div class="label" style="left:555px;top:310px">提出工具调用</div>
  <div class="node permission"><b>权限检查</b><small>决定是否、如何执行</small></div>
  <div class="arrow left" style="left:662px;top:488px"></div>
  <div class="node execute"><b>执行工具</b><small>读文件、改代码、测试</small></div>
  <div class="arrow left" style="left:286px;top:488px"></div>
  <div class="node result"><b>记录结果</b><small>成功或失败都要反馈</small></div>
  <div class="arrow up" style="left:139px;top:272px"></div>
  <div class="label" style="left:155px;top:307px">继续</div>
</main>
</html>
